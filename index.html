<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature</title>
</head>
<body>
    <h1>Temperature Convertor</h1>
    <input type="number" name="number" id="number" value="0">
    <input type="radio" name="toFahrenheit" id="toFahrenheit">
    <label for="toFahrenheit">Calicos to Fahrenheit</label>

    <input type="radio" name="toCalicos" id="toCalicos">
    <label for="toCalicos">Fahrenheit to Calicos</label>

    <button id="convert">Convert</button>
    <p id="result">Show result</p>
</body>
</html>
